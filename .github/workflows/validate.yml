name: Validate Plugins
on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install BATS
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats jq

      - name: Run structural validation
        run: bash tests/validate-plugins.sh

      - name: Run hook tests
        run: bats tests/hooks/
